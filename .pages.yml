# Pages CMS – Redaktionsoberfläche für johannesbrix.com
# Anmelden: https://app.pagescms.org mit GitHub → Repository johannesbrix/website → Branch main.
# Doku: https://pagescms.org/docs/
# Aufbau wie die Website (Johannes, 22.11.2026: „etwas unübersichtlich“): oben die Beiträge, dann je
# Seite genau die Texte, die dort stehen. Jedes Feld sagt, wo es auf der Website erscheint.

media:
  - name: bilder
    label: Bilder
    input: src/assets/bilder
    output: ../../assets/bilder      # relativ zu src/content/<ordner>/<datei>
    extensions: [jpg, jpeg, png, webp] # kein HEIC: das kann der Build nicht verarbeiten
    rename: safe
  - name: musik
    label: Musik
    input: public/musik
    output: /musik
    categories: [audio]
    rename: safe

content:
  # ---------- Beiträge: das, was du am häufigsten brauchst ----------
  - name: beitraege
    label: Beiträge
    type: collection
    path: src/content/beitraege
    filename: "{primary}.md"
    view:
      fields: [titel, bereich, status, datum]
      primary: titel
      sort: [datum, titel]
      default:
        sort: datum
        order: desc
    fields:
      # Das Wichtigste zuerst
      - name: titel
        label: Titel
        type: string
        required: true
      - name: datum
        label: Datum
        description: Steht im Beitrag; danach sind die Projekte sortiert.
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: bereich
        label: Bereich
        type: select
        required: true
        options:
          values:
            - { name: bauen, label: Bauen }
            - { name: gourmet, label: Gourmet }
            - { name: sport, label: Sport }
            - { name: menschen, label: "Menschen & Community" }
      - name: titelbild
        label: Titelbild
        description: Erscheint als Cover oben im Beitrag (wie bei Notion) und als Bild in den Projektlisten. Querformat wirkt am besten; die Mitte des Bildes bleibt immer sichtbar.
        type: image
        options:
          media: bilder
      - name: titelbild_alt
        label: Bildbeschreibung (Was ist auf dem Titelbild zu sehen?)
        type: string
      - name: body
        label: Story
        type: rich-text
        options:
          format: markdown
          media: false
      - name: mitnehmen
        label: Zum Mitnehmen
        description: 1–2 Sätze, was der Leser aus dem Beitrag für sich mitnehmen kann. Steht hervorgehoben unter der Story.
        type: text
      # Optional
      - name: tags
        label: Tags (optional)
        type: string
        list: true
      - name: status
        label: Status (nur bei Projekten)
        type: select
        options:
          values:
            - { name: geplant, label: Geplant }
            - { name: laeuft, label: Läuft }
            - { name: fertig, label: Fertig }
            - { name: pausiert, label: Pausiert }
      - name: aktiv
        label: Auf der Startseite unter „Gerade dran“ zeigen
        type: boolean
        default: false
      - name: bildunterschrift
        label: Bildunterschrift (optional, klein unter dem Cover)
        type: string
      - name: galerie
        label: Galerie (weitere Bilder unter der Story)
        type: object
        list: true
        fields:
          - name: bild
            label: Bild
            type: image
            options:
              media: bilder
          - name: alt
            label: Bildbeschreibung
            type: string
      - name: updates
        label: Updates (Bautagebuch, das Neueste steht oben)
        type: object
        list: true
        fields:
          - name: datum
            label: Datum
            type: date
            options:
              format: yyyy-MM-dd
          - name: text
            label: Was ist passiert?
            type: text
          - name: bild
            label: Bild (optional)
            type: image
            options:
              media: bilder
          - name: bild_alt
            label: Bildbeschreibung
            type: string
      - name: orte
        label: Orte zum Beitrag (erscheinen orange auf der Brixmap, mit Link zum Beitrag)
        description: Einfacher geht es direkt auf der Karte mit deinem freigeschalteten Handy. Hier nur, wenn der Ort zum Beitrag verlinken soll.
        type: object
        list: true
        fields:
          - name: name
            label: Name des Orts
            type: string
            required: true
          - name: koordinaten
            label: Koordinaten
            description: "So: 48.13743, 11.57549 – in Google Maps per Rechtsklick (am Handy: lange auf den Ort tippen) kopieren."
            type: string
            required: true
          - name: notiz
            label: Notiz für die Karte (optional)
            type: text
      - name: entwurf
        label: Entwurf (noch nicht veröffentlichen)
        type: boolean
        default: false

  # ---------- Startseite ----------
  - name: startseite
    label: Startseite
    type: file
    path: src/content/einstellungen/startseite.yml
    format: yaml
    fields:
      - name: intro
        label: Intro (der große Text neben deinem Porträt)
        description: Der Punkt am Ende wird automatisch zum orangen Punkt. Den Text zur Brixmap auf der Startseite findest du unter „Brixmap“, den zu Rise & Shine unter „Rise & Shine › Band“.
        type: text
        required: true
      - name: portrait
        label: Porträt
        type: image
        options:
          media: bilder
      - name: portrait_alt
        label: Bildbeschreibung Porträt
        type: string

  # ---------- Rise & Shine ----------
  - name: rise
    label: Rise & Shine
    type: group
    items:
      - name: band
        label: Band (oben auf Rise & Shine und auf der Startseite)
        type: file
        path: src/content/einstellungen/band.yml
        format: yaml
        fields:
          - name: motto
            label: Überschrift
            type: string
          - name: motto_text
            label: Text unter der Überschrift
            type: text
          - name: klick
            label: Klick-Knopf
            type: object
            fields:
              - { name: knopf, label: Text auf dem Knopf, type: string }
              - { name: zaehler, label: Wort hinter der Zahl (z. B. „geklickt“), type: string }

      - name: geschichte
        label: Geschichte („Warum Rise and Shine“)
        type: file
        path: src/content/seiten/rise-and-shine.md
        format: yaml-frontmatter
        fields:
          - name: titel
            label: Seitentitel (Browser-Tab)
            type: string
            required: true
          - name: body
            label: Deine Geschichte
            type: rich-text
            options:
              format: markdown
              media: false

      - name: zitate
        label: Zitate
        type: file
        path: src/content/einstellungen/zitate.yml
        format: yaml
        list: true
        fields:
          - name: text
            label: Zitat
            description: Kurz halten, etwa bis 60 Zeichen. Das längste Zitat bestimmt die Höhe der Zitatkarte im Band.
            type: text
            required: true
          - name: von
            label: Von
            type: string
          - name: quelle
            label: Quelle
            type: string

      - name: videos
        label: Videos und Reden
        type: file
        path: src/content/einstellungen/videos.yml
        format: yaml
        list: true
        fields:
          - name: titel
            label: Titel
            type: string
            required: true
          - name: link
            label: YouTube-Link
            type: string
            required: true
          - name: von
            label: Kanal
            type: string
          - name: warum
            label: Warum es dich bewegt (optional)
            type: text
          - name: art
            label: Regal
            type: select
            options:
              values:
                - { name: motivation, label: Videos }
                - { name: rede, label: Reden }
          - name: geschichte
            label: Groß neben deiner Geschichte zeigen (nur bei einem Video)
            type: boolean
            default: false

      - name: buecher
        label: Bücher
        type: file
        path: src/content/einstellungen/buecher.yml
        format: yaml
        list: true
        fields:
          - name: titel
            label: Titel
            type: string
            required: true
          - name: autor
            label: Autor
            type: string
          - name: mitgenommen
            label: Was ich mitgenommen habe (1–2 Sätze, steht unter dem Buch)
            type: text
          - name: foto
            label: Foto (optional, am besten dein eigenes Exemplar; ohne Foto gibt es ein schlichtes Cover)
            type: image
            options:
              media: bilder
          - name: foto_alt
            label: Bildbeschreibung
            type: string
          - name: link
            label: Link (optional)
            type: string

  # ---------- Brixmap ----------
  - name: brixmap
    label: Brixmap
    type: file
    path: src/content/seiten/brixmap.md
    format: yaml-frontmatter
    fields:
      - name: titel
        label: Seitentitel (Browser-Tab)
        type: string
        required: true
      - name: body
        label: Text (oben auf der Karte und im Brixmap-Kasten der Startseite)
        description: Ein, zwei Sätze. Orte setzt du direkt auf der Karte, nicht hier.
        type: rich-text
        options:
          format: markdown
          media: false

  # ---------- Projekte: die vier Bereiche (Filter und Bereichsseiten) ----------
  - name: bereiche
    label: Bereiche
    type: collection
    path: src/content/bereiche
    # Die vier Bereiche sind fest (Slugs = URLs), deshalb nur bearbeiten
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [titel, reihenfolge]
      primary: titel
      sort: [reihenfolge]
    fields:
      - name: titel
        label: Name
        type: string
        required: true
      - name: navtitel
        label: Kurzname (Filter-Chips bei Projekte)
        type: string
      - name: reihenfolge
        label: Reihenfolge (Filter-Chips und Liste)
        type: number
        required: true
      - name: untertitel
        label: Untertitel (auf der Bereichsseite)
        type: string
      - name: bild
        label: Foto (auf der Bereichsseite)
        type: image
        options:
          media: bilder
      - name: bild_alt
        label: Bildbeschreibung
        type: string
      - name: body
        label: Intro (2–4 Sätze, auf der Bereichsseite)
        type: rich-text
        options:
          format: markdown
          media: false

  # ---------- Allgemein ----------
  - name: allgemein
    label: Allgemein
    type: group
    items:
      - name: einstellungen
        label: Name, Links und Musik
        type: file
        path: src/content/einstellungen/site.yml
        format: yaml
        fields:
          - name: name
            label: Name (Seitentitel und Footer)
            type: string
            required: true
          - name: beschreibung
            label: Kurzbeschreibung für Google und die Link-Vorschau (max. 155 Zeichen)
            type: text
          - name: links
            label: Links (Footer und Menü)
            type: object
            fields:
              - { name: instagram, label: Instagram, type: string }
              - { name: strava, label: Strava, type: string }
              - { name: substack, label: Substack (Blog), type: string }
              - { name: linkedin, label: LinkedIn (Lebenslauf), type: string }
          - name: plattenteller
            label: Musik (Plattenteller)
            type: object
            fields:
              - name: datei
                label: Song (nur lizenzfreie Musik!)
                type: file
                options:
                  media: musik
              - { name: titel, label: Songtitel, type: string }
              - { name: interpret, label: Interpret, type: string }
              - { name: lizenz, label: Lizenzhinweis, type: string }
              - name: fliegende_platte
                label: Fliegende Platte
                description: Eine Platte fliegt über die Seite; ein Tipp darauf startet die Musik
                type: boolean
                default: true

      - name: impressum
        label: Impressum
        type: file
        path: src/content/seiten/impressum.md
        format: yaml-frontmatter
        fields:
          - name: titel
            label: Titel
            type: string
            required: true
          - name: body
            label: Text
            type: rich-text
            options:
              format: markdown
              media: false

      - name: datenschutz
        label: Datenschutz
        type: file
        path: src/content/seiten/datenschutz.md
        format: yaml-frontmatter
        fields:
          - name: titel
            label: Titel
            type: string
            required: true
          - name: body
            label: Text
            type: rich-text
            options:
              format: markdown
              media: false
